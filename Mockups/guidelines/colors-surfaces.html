<!-- @dsCard group="Colors" viewport="700x160" subtitle="Near-black base and elevated surface" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-base); font-family: var(--font-ui); }
  .row { display: flex; }
  .sw { flex: 1; height: 140px; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; }
  .name { color: var(--text-primary); font-size: var(--text-sm); font-weight: var(--weight-medium); }
  .hex { color: var(--text-secondary); font-size: var(--text-xs); font-family: var(--font-mono); margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background: var(--bg-base); border-right: 1px solid var(--border-subtle);">
    <div class="name">bg-base</div>
    <div class="hex">#0A0A0F</div>
  </div>
  <div class="sw" style="background: var(--bg-elevated);">
    <div class="name">bg-elevated</div>
    <div class="hex">#13131A</div>
  </div>
</div>
</body>
</html>
