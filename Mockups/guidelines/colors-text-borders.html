<!-- @dsCard group="Colors" viewport="700x150" subtitle="Text hierarchy and border opacities on elevated surface" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-base); font-family: var(--font-ui); }
  #root { padding: 20px; display: flex; gap: 20px; }
  .text-col { display: flex; flex-direction: column; gap: 8px; }
  .primary { color: var(--text-primary); font-size: var(--text-md); font-weight: var(--weight-semibold); }
  .secondary { color: var(--text-secondary); font-size: var(--text-sm); }
  .disabled { color: var(--text-disabled); font-size: var(--text-sm); }
  .border-col { display: flex; gap: 16px; align-items: flex-end; }
  .b { width: 80px; height: 60px; border-radius: var(--radius-md); background: var(--bg-elevated); }
  .b1 { border: 1px solid var(--border-subtle); }
  .b2 { border: 1px solid var(--border-default); }
  .b3 { border: 1px solid var(--border-strong); }
  .caption { color: var(--text-secondary); font-size: var(--text-xs); font-family: var(--font-mono); text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div id="root">
  <div class="text-col">
    <div class="primary">Text primary — F4F4F5</div>
    <div class="secondary">Text secondary — A1A1AA</div>
    <div class="disabled">Text disabled — 71717A</div>
  </div>
  <div>
    <div class="border-col">
      <div><div class="b b1"></div><div class="caption">8% subtle</div></div>
      <div><div class="b b2"></div><div class="caption">12% default</div></div>
      <div><div class="b b3"></div><div class="caption">18% strong</div></div>
    </div>
  </div>
</div>
</body>
</html>
