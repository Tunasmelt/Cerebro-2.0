<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Radius scale — subtle, no pills except badges" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-base); font-family: var(--font-ui); }
  #root { padding: 20px; display: flex; gap: 20px; align-items: flex-end; }
  .box { width: 90px; height: 90px; background: var(--bg-elevated); border: 1px solid var(--border-default); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  .cap { color: var(--text-secondary); font-size: var(--text-xs); font-family: var(--font-mono); }
</style>
</head>
<body>
<div id="root">
  <div class="box" style="border-radius: var(--radius-sm);"><span class="cap">sm · 6px</span></div>
  <div class="box" style="border-radius: var(--radius-md);"><span class="cap">md · 8px</span></div>
  <div class="box" style="border-radius: var(--radius-lg);"><span class="cap">lg · 12px</span></div>
  <div class="box" style="border-radius: var(--radius-pill); width: 130px;"><span class="cap">pill · 999px</span></div>
</div>
</body>
</html>
