<!-- @dsCard group="Type" viewport="700x230" subtitle="JetBrains Mono — for anything numeric or code-like" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-base); }
  #root { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; font-family: var(--font-mono); }
  .item { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; }
  .k { color: var(--text-secondary); font-size: var(--text-xs); }
  .v { color: var(--text-primary); font-size: var(--text-sm); }
  .v.accent { color: var(--accent-primary-hover); }
</style>
</head>
<body>
<div id="root">
  <div class="item"><span class="k">token count</span><span class="v">18,204</span></div>
  <div class="item"><span class="k">latency</span><span class="v accent">118ms</span></div>
  <div class="item"><span class="k">chunk id</span><span class="v">chk_9f2a1c4e</span></div>
  <div class="item"><span class="k">file size</span><span class="v">2.4kb</span></div>
  <div class="item"><span class="k">embedding dims</span><span class="v">1536</span></div>
  <div class="item"><span class="k">vault size</span><span class="v">412.8mb</span></div>
</div>
</body>
</html>
