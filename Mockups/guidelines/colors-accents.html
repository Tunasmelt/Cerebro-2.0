<!-- @dsCard group="Colors" viewport="700x200" subtitle="Violet (primary, sparing), teal (secondary), amber (lock only), red (danger)" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-base); font-family: var(--font-ui); }
  .row { display: flex; }
  .sw { flex: 1; height: 160px; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; border-right: 1px solid var(--bg-base); }
  .name { color: var(--text-on-accent); font-size: var(--text-sm); font-weight: var(--weight-semibold); }
  .hex { color: var(--text-on-accent); opacity: 0.7; font-size: var(--text-xs); font-family: var(--font-mono); margin-top: 2px; }
  .usage { color: var(--text-on-accent); opacity: 0.8; font-size: var(--text-xs); margin-top: 6px; max-width: 140px; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background: var(--accent-primary);">
    <div class="name">accent-primary</div>
    <div class="hex">#8B5CF6</div>
    <div class="usage">Retrieval pulses, active nodes, primary CTAs — use sparingly</div>
  </div>
  <div class="sw" style="background: var(--accent-secondary);">
    <div class="name">accent-secondary</div>
    <div class="hex">#2DD4BF</div>
    <div class="usage">Secondary actions, success states</div>
  </div>
  <div class="sw" style="background: var(--accent-locked);">
    <div class="name">accent-locked</div>
    <div class="hex">#F59E0B</div>
    <div class="usage">Encryption / lock UI exclusively</div>
  </div>
  <div class="sw" style="background: var(--danger);">
    <div class="name">danger</div>
    <div class="hex">#EF4444</div>
    <div class="usage">Destructive actions only</div>
  </div>
</div>
</body>
</html>
