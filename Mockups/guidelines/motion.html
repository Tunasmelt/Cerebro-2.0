<!-- @dsCard group="Brand" viewport="700x220" subtitle="Soft ease for the calm UI vs. the sharp retrieval-pulse" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-base); font-family: var(--font-ui); }
  #root { padding: 24px; display: flex; gap: 40px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cap { color: var(--text-secondary); font-size: var(--text-xs); font-family: var(--font-mono); text-align: center; max-width: 180px; }
  .panel { width: 120px; height: 60px; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-lg); animation: soft-slide 2.4s var(--ease-soft) infinite alternate; }
  @keyframes soft-slide { from { transform: translateY(0); } to { transform: translateY(16px); } }
  .dot-wrap { position: relative; width: 20px; height: 20px; }
  .dot { position: absolute; inset: 0; border-radius: 50%; background: var(--accent-primary); }
  .ping { position: absolute; inset: 0; border-radius: 50%; background: var(--accent-primary); animation: pulse-ring var(--duration-pulse) var(--ease-pulse) infinite; }
  @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }
</style>
</head>
<body>
<div id="root">
  <div class="col">
    <div class="panel"></div>
    <div class="cap">ease-soft · 220ms<br/>panels, nodes, hovers</div>
  </div>
  <div class="col">
    <div class="dot-wrap"><div class="dot"></div><div class="ping"></div></div>
    <div class="cap">ease-pulse · 480ms<br/>retrieval pulse only</div>
  </div>
</div>
</body>
</html>
