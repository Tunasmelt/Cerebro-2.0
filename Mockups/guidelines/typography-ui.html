<!-- @dsCard group="Type" viewport="700x300" subtitle="Inter — UI text scale" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-base); }
  #root { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .line { display: flex; align-items: baseline; gap: 14px; }
  .tag { color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px; width: 90px; flex-shrink: 0; }
  .sample { color: var(--text-primary); font-family: var(--font-ui); }
</style>
</head>
<body>
<div id="root">
  <div class="line"><span class="tag">4xl / 40</span><span class="sample" style="font-size: var(--text-4xl); font-weight: var(--weight-semibold);">Neural recall</span></div>
  <div class="line"><span class="tag">2xl / 24</span><span class="sample" style="font-size: var(--text-2xl); font-weight: var(--weight-semibold);">Your second brain</span></div>
  <div class="line"><span class="tag">lg / 18</span><span class="sample" style="font-size: var(--text-lg); font-weight: var(--weight-medium);">Every note, connected</span></div>
  <div class="line"><span class="tag">base / 14</span><span class="sample" style="font-size: var(--text-base); font-weight: var(--weight-regular);">Cerebro indexes and links your knowledge automatically.</span></div>
  <div class="line"><span class="tag">sm / 13</span><span class="sample" style="font-size: var(--text-sm); font-weight: var(--weight-regular); color: var(--text-secondary);">Secondary copy, captions, helper text.</span></div>
  <div class="line"><span class="tag">xs / 12</span><span class="sample" style="font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--text-secondary); letter-spacing: 0.02em;">LABEL / METADATA</span></div>
</div>
</body>
</html>
