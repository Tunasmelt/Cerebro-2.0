<!-- @dsCard group="Spacing" viewport="700x220" subtitle="4px base scale" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-base); font-family: var(--font-mono); }
  #root { padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .bar { background: var(--accent-primary); height: 10px; border-radius: 2px; }
  .label { color: var(--text-secondary); font-size: var(--text-xs); width: 90px; }
</style>
</head>
<body>
<div id="root">
  <div class="row"><span class="label">space-1 · 4px</span><div class="bar" style="width: var(--space-1);"></div></div>
  <div class="row"><span class="label">space-2 · 8px</span><div class="bar" style="width: var(--space-2);"></div></div>
  <div class="row"><span class="label">space-3 · 12px</span><div class="bar" style="width: var(--space-3);"></div></div>
  <div class="row"><span class="label">space-4 · 16px</span><div class="bar" style="width: var(--space-4);"></div></div>
  <div class="row"><span class="label">space-6 · 24px</span><div class="bar" style="width: var(--space-6);"></div></div>
  <div class="row"><span class="label">space-8 · 32px</span><div class="bar" style="width: var(--space-8);"></div></div>
  <div class="row"><span class="label">space-12 · 48px</span><div class="bar" style="width: var(--space-12);"></div></div>
  <div class="row"><span class="label">space-16 · 64px</span><div class="bar" style="width: var(--space-16);"></div></div>
</div>
</body>
</html>
