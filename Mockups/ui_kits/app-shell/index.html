<!-- @dsCard group="Landing" viewport="1440x900" subtitle="Authenticated app shell — sidebar, top bar, empty Brain canvas" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cerebro — app shell</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui); overflow: hidden; }
  .shell { display: flex; height: 100vh; }

  /* ---- sidebar ---- */
  .sidebar { width: 220px; flex-shrink: 0; background: var(--bg-elevated); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; padding: var(--space-4) 0; transition: width var(--duration-base) var(--ease-soft); }
  .sidebar.collapsed { width: 64px; }
  .sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-4); margin-bottom: var(--space-6); }
  .brand-mark { font-weight: var(--weight-semibold); font-size: var(--text-md); white-space: nowrap; overflow: hidden; }
  .collapse-btn { width: 24px; height: 24px; border-radius: var(--radius-sm); border: 1px solid var(--border-default); background: transparent; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .collapse-btn:hover { background: var(--bg-elevated-hover); border-color: var(--border-strong); }

  .nav-group { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--space-2); }
  .nav-divider { height: 1px; background: var(--border-subtle); margin: var(--space-4) var(--space-4); }
  .nav-item {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
    color: var(--text-secondary); font-size: var(--text-sm); font-weight: var(--weight-medium);
    cursor: pointer; white-space: nowrap; overflow: hidden;
    transition: background var(--duration-base) var(--ease-soft), color var(--duration-base) var(--ease-soft);
  }
  .nav-item svg { flex-shrink: 0; }
  .nav-item:hover { background: var(--bg-elevated-hover); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-primary-subtle); color: var(--text-primary); }
  .nav-item.active svg { color: var(--accent-primary-hover); }
  .nav-item.secondary { opacity: 0.75; }
  .sidebar.collapsed .nav-label, .sidebar.collapsed .brand-mark { display: none; }
  .sidebar.collapsed .sidebar-top { justify-content: center; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: var(--space-2); }

  .sidebar-bottom { margin-top: auto; padding: 0 var(--space-2); }

  /* ---- main ---- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-5); border-bottom: 1px solid var(--border-subtle); }
  .search-wrap { flex: 1; max-width: 420px; position: relative; }
  .search-wrap input {
    width: 100%; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-md);
    color: var(--text-primary); padding: var(--space-2) var(--space-3) var(--space-2) 34px; font-size: var(--text-sm); font-family: var(--font-ui);
    transition: border-color var(--duration-base) var(--ease-soft), box-shadow var(--duration-base) var(--ease-soft);
  }
  .search-wrap input::placeholder { color: var(--text-disabled); }
  .search-wrap input:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-primary-subtle); }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-disabled); }

  .status-pill { display: none; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-secondary); background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-pill); padding: 4px var(--space-3); white-space: nowrap; }
  .status-pill.visible { display: flex; }
  .status-dot-wrap { position: relative; width: 6px; height: 6px; }
  .status-dot { position: absolute; inset: 0; border-radius: 50%; background: var(--accent-primary); }
  .status-ping { position: absolute; inset: 0; border-radius: 50%; background: var(--accent-primary); animation: pulse-ring var(--duration-pulse) var(--ease-pulse) infinite; }
  @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(2.6); opacity: 0; } }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-4); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-elevated-hover); border: 1px solid var(--border-default); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: var(--weight-semibold); color: var(--text-secondary); cursor: pointer; }
  .avatar:hover { border-color: var(--border-strong); }

  /* ---- canvas / empty state ---- */
  .canvas { flex: 1; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 45%, rgba(139,92,246,0.04), transparent 60%); }
  .canvas-grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(244,244,245,0.04) 1px, transparent 1px); background-size: 28px 28px; }
  .empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-6); }
  .empty-state svg.faint { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5; }
  .empty-copy { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); z-index: 1; }
  .empty-copy p { margin: 0; font-size: var(--text-sm); color: var(--text-secondary); }
  .btn-primary {
    display: inline-flex; align-items: center; gap: var(--space-2); font-family: var(--font-ui); font-weight: var(--weight-medium); font-size: var(--text-sm);
    background: var(--accent-primary); color: var(--text-on-accent); border: 1px solid transparent; border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-6); cursor: pointer; transition: background var(--duration-base) var(--ease-soft);
  }
  .btn-primary:hover { background: var(--accent-primary-hover); }
  .btn-primary:active { background: var(--accent-primary-active); }

  /* demo-only controls, not part of product UI */
  .demo-controls { position: absolute; bottom: 16px; right: 16px; display: flex; gap: var(--space-2); z-index: 2; }
  .demo-controls button { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-pill); padding: 4px 12px; cursor: pointer; }
  .demo-controls button.active { color: var(--text-primary); border-color: var(--accent-primary-border); }
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <span class="brand-mark">Cerebro</span>
      <button class="collapse-btn" id="collapse-btn" onclick="toggleSidebar()">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M8 2L4 6L8 10" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="nav-group">
      <div class="nav-item active">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><circle cx="8.5" cy="8.5" r="2.2" fill="currentColor"/><circle cx="3.5" cy="4.5" r="1.3" fill="currentColor" opacity="0.6"/><circle cx="13.5" cy="5" r="1.3" fill="currentColor" opacity="0.6"/><circle cx="4" cy="13" r="1.3" fill="currentColor" opacity="0.6"/><circle cx="13" cy="12.5" r="1.3" fill="currentColor" opacity="0.6"/><path d="M8.5 8.5L3.5 4.5M8.5 8.5L13.5 5M8.5 8.5L4 13M8.5 8.5L13 12.5" stroke="currentColor" stroke-width="0.8" opacity="0.4"/></svg>
        <span class="nav-label">Brain</span>
      </div>
      <div class="nav-item">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><rect x="3.5" y="2.5" width="10" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 6.5H11M6 9H11M6 11.5H9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
        <span class="nav-label">Documents</span>
      </div>
      <div class="nav-item">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M3 3.5H14V11H8.5L5 13.5V11H3V3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        <span class="nav-label">Chat</span>
      </div>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-group">
      <div class="nav-item secondary">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><rect x="2.5" y="3" width="12" height="11" rx="1.3" stroke="currentColor" stroke-width="1.2"/><path d="M6.3 3V14M10.7 3V14" stroke="currentColor" stroke-width="1.2"/></svg>
        <span class="nav-label">Kanban</span>
      </div>
      <div class="nav-item secondary">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><rect x="3.5" y="3.5" width="3" height="3" rx="0.6" stroke="currentColor" stroke-width="1.2"/><path d="M8.5 5H14M3.5 10.5H6.5V13.5H3.5V10.5ZM8.5 12H14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="nav-label">Tasks</span>
      </div>
      <div class="nav-item secondary">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M5 3.5L13 8.5L5 13.5V3.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span class="nav-label">Playground</span>
      </div>
    </div>

    <div class="sidebar-bottom">
      <div class="nav-item">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><circle cx="8.5" cy="8.5" r="2" stroke="currentColor" stroke-width="1.2"/><path d="M8.5 3V4.5M8.5 12.5V14M14 8.5H12.5M4.5 8.5H3M12.2 4.8L11.2 5.8M5.8 11.2L4.8 12.2M12.2 12.2L11.2 11.2M5.8 5.8L4.8 4.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="nav-label">Settings</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.2" stroke="currentColor" stroke-width="1.3"/><path d="M9.2 9.2L12 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <input type="text" placeholder="Filter documents by title…" />
      </div>
      <div class="status-pill" id="status-pill">
        <span class="status-dot-wrap"><span class="status-dot"></span><span class="status-ping"></span></span>
        <span>2 documents processing…</span>
      </div>
      <div class="topbar-right">
        <div class="avatar">JS</div>
      </div>
    </div>

    <div class="canvas">
      <div class="canvas-grid"></div>
      <div class="empty-state">
        <svg class="faint" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
          <circle cx="180" cy="140" r="4" fill="#A1A1AA" opacity="0.25"/>
          <circle cx="720" cy="120" r="3.5" fill="#A1A1AA" opacity="0.2"/>
          <circle cx="120" cy="440" r="3" fill="#A1A1AA" opacity="0.2"/>
          <circle cx="760" cy="460" r="4" fill="#A1A1AA" opacity="0.22"/>
          <circle cx="450" cy="90" r="3" fill="#A1A1AA" opacity="0.18"/>
          <circle cx="440" cy="520" r="3.5" fill="#A1A1AA" opacity="0.2"/>
          <line x1="180" y1="140" x2="450" y2="90" stroke="rgba(244,244,245,0.05)" stroke-width="1"/>
          <line x1="720" y1="120" x2="450" y2="90" stroke="rgba(244,244,245,0.05)" stroke-width="1"/>
          <line x1="120" y1="440" x2="440" y2="520" stroke="rgba(244,244,245,0.05)" stroke-width="1"/>
          <line x1="760" y1="460" x2="440" y2="520" stroke="rgba(244,244,245,0.05)" stroke-width="1"/>
        </svg>
        <div class="empty-copy">
          <button class="btn-primary">Upload your first document</button>
          <p>Your graph will start forming as soon as it lands.</p>
        </div>
      </div>
      <div class="demo-controls">
        <button class="active" onclick="setIngest(false, this)">idle</button>
        <button onclick="setIngest(true, this)">processing</button>
      </div>
    </div>
  </div>
</div>

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}
function setIngest(active, el) {
  document.querySelectorAll('.demo-controls button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('status-pill').classList.toggle('visible', active);
}
</script>
</body>
</html>
