<!-- @dsCard group="Landing" viewport="1440x900" subtitle="Todo list — flat linear list, priority dots, collapsed completed section" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cerebro — Tasks</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui); }
  .page { max-width: 640px; margin: 0 auto; padding: 40px; }
  .page-header h1 { font-size: var(--text-2xl); font-weight: var(--weight-semibold); margin: 0 0 var(--space-5); }

  .add-row { display: flex; align-items: center; gap: var(--space-3); background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-5); }
  .add-row input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: var(--text-sm); font-family: var(--font-ui); }
  .add-row input::placeholder { color: var(--text-disabled); }
  .add-row .plus { color: var(--text-disabled); font-size: 15px; }

  .list { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-2); border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: none; }

  .checkbox { width: 16px; height: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; }
  .checkbox:hover { border-color: var(--accent-secondary); }
  .checkbox.checked { background: var(--accent-secondary); border-color: var(--accent-secondary); }
  .checkbox svg { display: none; }
  .checkbox.checked svg { display: block; }

  .priority-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .priority-dot.low { background: var(--text-disabled); }
  .priority-dot.medium { background: var(--accent-secondary); }
  .priority-dot.high { background: var(--accent-primary); }

  .task-text { flex: 1; font-size: var(--text-sm); color: var(--text-primary); }
  .row.done .task-text { color: var(--text-disabled); text-decoration: line-through; }
  .row.done .priority-dot { opacity: 0.4; }

  .due-date { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }
  .row.done .due-date { color: var(--text-disabled); }

  .completed-section { margin-top: var(--space-6); }
  .completed-toggle { display: flex; align-items: center; gap: var(--space-2); background: none; border: none; color: var(--text-secondary); font-size: var(--text-xs); font-family: var(--font-ui); font-weight: var(--weight-medium); cursor: pointer; padding: var(--space-2); }
  .completed-toggle:hover { color: var(--text-primary); }
  .completed-toggle .chevron { transition: transform var(--duration-base) var(--ease-soft); }
  .completed-toggle.open .chevron { transform: rotate(90deg); }
  .completed-list { display: none; flex-direction: column; }
  .completed-list.open { display: flex; }
</style>
</head>
<body>
<div class="page">
  <div class="page-header"><h1>Tasks</h1></div>

  <div class="add-row">
    <span class="plus">+</span>
    <input type="text" id="new-task-input" placeholder="Add a task and press Enter…" />
  </div>

  <div class="list" id="active-list">
    <div class="row">
      <button class="checkbox" onclick="toggleRow(this)"><svg width="9" height="7" viewBox="0 0 9 7"><path d="M1 3.5L3.2 5.7L8 1" stroke="#0A0A0F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="priority-dot high"></span>
      <span class="task-text">Fix kebab menu z-index on Documents view</span>
      <span class="due-date">Sep 2</span>
    </div>
    <div class="row">
      <button class="checkbox" onclick="toggleRow(this)"><svg width="9" height="7" viewBox="0 0 9 7"><path d="M1 3.5L3.2 5.7L8 1" stroke="#0A0A0F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="priority-dot medium"></span>
      <span class="task-text">Reply to design system feedback thread</span>
      <span class="due-date">Sep 3</span>
    </div>
    <div class="row">
      <button class="checkbox" onclick="toggleRow(this)"><svg width="9" height="7" viewBox="0 0 9 7"><path d="M1 3.5L3.2 5.7L8 1" stroke="#0A0A0F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="priority-dot low"></span>
      <span class="task-text">Read the CRDT survey paper</span>
    </div>
    <div class="row">
      <button class="checkbox" onclick="toggleRow(this)"><svg width="9" height="7" viewBox="0 0 9 7"><path d="M1 3.5L3.2 5.7L8 1" stroke="#0A0A0F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="task-text">Rename "Playground" nav item copy</span>
      <span class="due-date">Sep 8</span>
    </div>
  </div>

  <div class="completed-section">
    <button class="completed-toggle" id="completed-toggle" onclick="toggleCompleted()">
      <svg class="chevron" width="8" height="8" viewBox="0 0 8 8"><path d="M2 1L6 4L2 7" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Completed (2)
    </button>
    <div class="completed-list" id="completed-list">
      <div class="row done">
        <button class="checkbox checked" onclick="toggleRow(this)"><svg width="9" height="7" viewBox="0 0 9 7"><path d="M1 3.5L3.2 5.7L8 1" stroke="#0A0A0F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="priority-dot medium"></span>
        <span class="task-text">Ship sign-in / sign-up screens</span>
      </div>
      <div class="row done">
        <button class="checkbox checked" onclick="toggleRow(this)"><svg width="9" height="7" viewBox="0 0 9 7"><path d="M1 3.5L3.2 5.7L8 1" stroke="#0A0A0F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="priority-dot low"></span>
        <span class="task-text">Draft onboarding copy</span>
        <span class="due-date">Aug 29</span>
      </div>
    </div>
  </div>
</div>

<script>
function toggleRow(btn) {
  const row = btn.closest('.row');
  const nowDone = !row.classList.contains('done');
  btn.classList.toggle('checked', nowDone);
  if (nowDone) {
    row.classList.add('done');
    document.getElementById('completed-list').appendChild(row);
    updateCount();
  } else {
    row.classList.remove('done');
    document.getElementById('active-list').appendChild(row);
    updateCount();
  }
}
function updateCount() {
  const n = document.getElementById('completed-list').children.length;
  document.getElementById('completed-toggle').lastChild.textContent = ` Completed (${n})`;
}
function toggleCompleted() {
  document.getElementById('completed-toggle').classList.toggle('open');
  document.getElementById('completed-list').classList.toggle('open');
}
document.getElementById('new-task-input').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<button class="checkbox" onclick="toggleRow(this)"><svg width="9" height="7" viewBox="0 0 9 7"><path d="M1 3.5L3.2 5.7L8 1" stroke="#0A0A0F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="priority-dot low"></span><span class="task-text">${e.target.value.trim()}</span>`;
  document.getElementById('active-list').prepend(row);
  e.target.value = '';
});
</script>
</body>
</html>
