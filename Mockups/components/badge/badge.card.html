<!-- @dsCard group="Components" viewport="700x120" subtitle="Neutral, live (pulsing), success, and locked" name="Badge" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; background: var(--bg-base); }
  #root { padding: 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Badge } = window.Cerebro;
function Sheet() {
  return (
    <div style={{display: 'flex', gap: '12px', flexWrap: 'wrap', alignItems: 'center'}}>
      <Badge variant="neutral">Draft</Badge>
      <Badge variant="live" dot>Retrieving</Badge>
      <Badge variant="success">Indexed</Badge>
      <Badge variant="locked">Sealed</Badge>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Sheet />);
</script>
</body>
</html>
